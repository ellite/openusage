services:
  openusage:
    image: bellamy/openusage:latest
    container_name: openusage
    restart: unless-stopped
    ports:
      - "4188:8000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - ENABLE_ACCOUNT_CREATION=true  # set to false once you've created the accounts you need
      - SECRET_KEY=change-me-generate-a-random-string  # REQUIRED: replace with `openssl rand -hex 32`
      - VAPID_PRIVATE_KEY=e_eWJijmuviXlwAIIWjYzhl8GecRzTcvk_DHLyS3wWk
      - VAPID_PUBLIC_KEY=BDKtIjRt8yctjxc8k8eeGdaGo1Zt6krD6OxfejKuQUHIDCt93hNFsl5N9mzpmqx6-NHj1XqGUOMLm9TDupmFEJ0
      - VAPID_SUBJECT=mailto:bellamyhomelab@gmail.com
      # SMTP (optional) - powers "Forgot password?" on the login page.
      # - SERVER_URL=http://your-server:4188  # used to build the reset-password link
      # - SMTP_ADDRESS=
      # - SMTP_PORT=587
      # - SMTP_ENCRYPTION=tls  # tls, ssl, or none
      # - SMTP_USERNAME=
      # - SMTP_PASSWORD=
      # - FROM_EMAIL=

      # OIDC / SSO (optional)
      # - OIDC_ENABLED=true
      # - OIDC_PROVIDER_NAME=SSO
      # - OIDC_CLIENT_ID=
      # - OIDC_CLIENT_SECRET=
      # - OIDC_AUTH_URL=
      # - OIDC_TOKEN_URL=
      # - OIDC_USERINFO_URL=
      # - OIDC_REDIRECT_URL=http://your-server:4188/api/oidc/callback
      # - OIDC_IDENTIFIER_FIELD=email
      # - OIDC_SCOPES=openid email profile
      # - OIDC_AUTO_CREATE_USERS=true
      # - OIDC_DISABLE_PASSWORD_LOGIN=false

      # Push notifications (optional) - per-service usage-threshold alerts.
      # Generate a key pair with `python scripts/generate_vapid_keys.py`.
      # - VAPID_PUBLIC_KEY=
      # - VAPID_PRIVATE_KEY=
      # - VAPID_SUBJECT=mailto:you@example.com
    volumes:
      - ./data:/app/data
